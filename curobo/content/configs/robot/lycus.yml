# 模型是 PD2616-2.1 / AR5-5_08-W4C1C5。
# 碰撞球、cspace、自碰忽略沿用上一台 Lycus，只改了连杆和关节名。
# 夹爪仅接收实测状态，不参与优化；ROS 在每次规划前原地更新夹爪及 mimic 手指几何。
# Lycus cuRobo robot config.
# Planning uses collision_spheres; visualization uses URDF/STL.
# Regenerate with: python scripts/import_lycus.py
robot_cfg:
  kinematics:
    # 旧的加连杆方式。抓取物用下面的 extra_links。
    add_object_link: false
    # 网格目录，相对 cuRobo content/assets。
    asset_root_path: robot/lycus
    # 运动学树根。位姿相对这个连杆。
    base_link: base_link
    # 参与碰撞检测的连杆。
    collision_link_names:
    - Chassis_link
    - Calf_link
    - Thigh_link
    - Waist_link
    - Chest_link
    - Neck_link
    - Head_link
    - camera_link
    - AR5-5_08L-W4C1C5-ZY2_base
